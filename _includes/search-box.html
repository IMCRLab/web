<div class="search-box">
  <input
    type="text"
    class="search-input"
    oninput="onSearchInput(this)"
    placeholder="Search this page"
    data-placeholder-en="Search this page"
    data-placeholder-zh="搜索本页"
  />
  <button
    disabled
    data-tooltip="Clear search"
    data-tooltip-en="Clear search"
    data-tooltip-zh="清除搜索"
    aria-label="clear search"
    onclick="onSearchClear()"
  >
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</div>
